appId: org.adbtvremote.desktop
productName: ADB TV Remote
copyright: Copyright (c) 2026 ADB TV Remote contributors
publish:
  provider: github
  owner: simplemal
  repo: adb-tv-remote
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
extraResources:
  - from: resources/keyinput/keyinput.dex
    to: keyinput/keyinput.dex
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
afterPack: scripts/after-pack.js
mac:
  extraResources:
    - from: resources/bin/darwin-${arch}
      to: bin
  category: public.app-category.utilities
  icon: build/Icon.icon
  # The zip is what the app updates itself from, and its name must be the one latest-mac.yml says.
  artifactName: adb-tv-remote-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
  # "-" is an ad-hoc signature, which needs no certificate. It also stops electron-builder from
  # picking up whatever certificate is in the keychain. For a release, see README, "Signing".
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    NSLocalNetworkUsageDescription: ADB TV Remote connects to your TV over the local network.
win:
  extraResources:
    - from: resources/bin/win32-x64
      to: bin
  target: nsis
linux:
  extraResources:
    - from: resources/bin/linux-x64
      to: bin
  category: Utility
  target:
    - AppImage
    - deb
  maintainer: ADB TV Remote contributors
