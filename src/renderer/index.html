<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src blob:; base-uri 'none'; form-action 'none'">
<title>ADB TV Remote</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="screen" data-i18n-aria="screen.label">
  <img id="screen" alt="" draggable="false">
  <div id="touch-dot"></div>
  <div class="empty power-note waiting" id="power-note" role="status" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
    <strong id="power-title"></strong>
    <span id="power-text"></span>
  </div>
  <div class="empty waiting" id="empty" role="status">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8.5 20.5h7M12 17v3.5"/></svg>
    <strong id="empty-title"></strong>
    <span id="empty-text"></span>
    <button id="get-adb" type="button" data-i18n="action.getAdb" hidden></button>
  </div>
</section>

<button class="update" id="update-ready" type="button" data-i18n="update.ready" hidden></button>

<div class="card" id="device-card" hidden>
  <span id="status"></span>
  <button class="close" type="button" data-i18n-aria="action.close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <p class="note" id="no-ffmpeg" data-i18n="note.noFfmpeg" hidden></p>
  <ul class="devices" id="devices" hidden></ul>
  <form id="connect"><input id="address" data-i18n-placeholder="field.address" data-i18n-aria="field.address" autocomplete="off" spellcheck="false"><button data-i18n="action.connect"></button></form>
  <div class="row">
    <button class="pill" id="find" type="button" data-i18n="action.find"></button>
    <button class="pill" id="open-guide" type="button" data-i18n="action.guide"></button>
  </div>
  <ul class="found" id="found" hidden></ul>
  <label class="stacked"><span data-i18n="hold.label"></span>
    <input data-command="menuHold" data-i18n-placeholder="hold.hint" data-i18n-aria="hold.label" autocomplete="off" spellcheck="false">
  </label>
  <label class="stacked"><span data-i18n="home.label"></span>
    <input data-command="homeCommand" data-i18n-placeholder="hold.hint" data-i18n-aria="home.label" autocomplete="off" spellcheck="false">
  </label>
  <label class="setting"><span data-i18n="language.label"></span>
    <select id="language">
      <option value="auto" data-i18n="language.auto"></option>
      <option value="en">English</option>
      <option value="it">Italiano</option>
    </select>
  </label>
</div>
<div class="card" id="text-card" hidden>
  <span data-i18n="key.text"></span>
  <button class="close" type="button" data-i18n-aria="action.close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <form id="write"><input id="text" data-i18n-placeholder="field.text" data-i18n-aria="field.text" autocomplete="off"><button data-i18n="action.send"></button></form>
</div>

<main class="remote" id="remote" data-i18n-aria="remote.label" data-i18n-title="remote.help">
  <div class="head">
    <button class="key small" id="open-devices" data-i18n-aria="key.devices" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 4.5C8 4.5 4.400 6.100 1.800 8.700l1.600 1.600A12 12 0 0 1 12 6.700a12 12 0 0 1 8.600 3.600l1.600-1.600A14.200 14.200 0 0 0 12 4.500zm0 5.300c-2.500 0-4.800 1-6.500 2.700l1.600 1.600A7 7 0 0 1 12 12a7 7 0 0 1 4.900 2.100l1.600-1.600A9.200 9.200 0 0 0 12 9.800zm0 5.300a3.800 3.800 0 0 0-2.700 1.100L12 19l2.700-2.800a3.800 3.800 0 0 0-2.700-1.100z"/></svg></button>
    <span class="light" id="light"></span>
    <button class="key small power" data-key="POWER" data-i18n-aria="key.power"><svg viewBox="0 0 24 24"><path d="M10.9 2.5h2.2v9.6h-2.2zM6.7 5.2l1.4 1.7a7 7 0 1 0 7.8 0l1.4-1.7a9.2 9.2 0 1 1-10.6 0z"/></svg></button>
  </div>

  <div class="pad">
    <button class="up" data-key="DPAD_UP" data-i18n-aria="key.up"></button>
    <button class="left" data-key="DPAD_LEFT" data-i18n-aria="key.left"></button>
    <button class="right" data-key="DPAD_RIGHT" data-i18n-aria="key.right"></button>
    <button class="down" data-key="DPAD_DOWN" data-i18n-aria="key.down"></button>
    <button class="ok" data-key="DPAD_CENTER" data-hold data-i18n-aria="key.ok"></button>
  </div>

  <div class="grid">
    <button class="key" data-key="BACK" data-hold data-i18n-aria="key.back"><svg viewBox="0 0 24 24"><path d="M9.6 5.600 3.700 11a1.300 1.300 0 0 0 0 1.900l5.900 5.500 1.500-1.600-4-3.800H15a4 4 0 0 1 0 8h-2.500v2.200H15a6.200 6.200 0 0 0 0-12.400H7.100l4-3.800z" transform="translate(0 -2)"/></svg></button>
    <button class="key" data-key="HOME" data-hold data-i18n-aria="key.home"><svg viewBox="0 0 24 24"><path d="M12 3.2 2.6 11.6l1.4 1.6 1.5-1.3v8.4h5v-5.6h3v5.6h5v-8.4l1.5 1.3 1.4-1.6z"/></svg></button>
    <button class="key" data-key="GUIDE" data-i18n-aria="key.guide"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3.500 4.500h17A1.500 1.500 0 0 1 22 6v10.500a1.500 1.500 0 0 1-1.500 1.500H14v1.500h2.500v1.500h-9v-1.500H10V18H3.500A1.500 1.500 0 0 1 2 16.500V6a1.500 1.500 0 0 1 1.500-1.500zM4 6.500v9.500h16V6.500zM6 8.500h4v2H6zM11.500 8.500H18v2h-6.500zM6 12h4v2H6zM11.500 12H18v2h-6.500z"/></svg></button>
    <button class="key" data-key="MEDIA_REWIND" data-i18n-aria="key.rewind"><svg viewBox="0 0 24 24"><path d="M11.5 5.5v13L2.8 12zM21 5.5v13L12.3 12z"/></svg></button>
    <button class="key" data-key="MEDIA_PLAY_PAUSE" data-i18n-aria="key.playPause"><svg viewBox="0 0 24 24"><path d="M2.500 5.500v13l9.300-6.500zM14 5.500h3v13h-3zM18.800 5.500h3v13h-3z"/></svg></button>
    <button class="key" data-key="MEDIA_FAST_FORWARD" data-i18n-aria="key.fastForward"><svg viewBox="0 0 24 24"><path d="M3 5.500v13l8.700-6.500zM12.500 5.500v13l8.700-6.500z"/></svg></button>
    <div class="rocker">
      <button data-key="VOLUME_UP" data-i18n-aria="key.volumeUp"><svg viewBox="0 0 24 24"><path d="M10.900 5h2.200v5.900H19v2.200h-5.900V19h-2.200v-5.900H5v-2.200h5.900z"/></svg></button>
      <button data-key="VOLUME_DOWN" data-i18n-aria="key.volumeDown"><svg viewBox="0 0 24 24"><path d="M5 10.900h14v2.200H5z"/></svg></button>
    </div>
    <button class="key right" data-key="SETTINGS" data-i18n-aria="key.settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.600 7.600 0 0 0 0-2l2.100-1.600a.5.5 0 0 0 .1-.6l-2-3.500a.5.5 0 0 0-.6-.2l-2.500 1a7.400 7.400 0 0 0-1.700-1l-.4-2.600a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.600a7.400 7.400 0 0 0-1.700 1l-2.500-1a.5.5 0 0 0-.6.2l-2 3.500a.5.5 0 0 0 .1.6L4.600 11a7.600 7.600 0 0 0 0 2l-2.100 1.600a.5.5 0 0 0-.1.6l2 3.500c.1.200.4.300.6.200l2.500-1c.5.400 1.100.700 1.700 1l.4 2.600c0 .200.2.400.5.400h4c.3 0 .5-.2.5-.4l.4-2.600a7.400 7.400 0 0 0 1.700-1l2.500 1c.2.100.5 0 .6-.2l2-3.500a.5.5 0 0 0-.1-.6zM12 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z"/></svg></button>
    <button class="key right" data-key="MENU" data-hold data-i18n-aria="key.menu"><svg viewBox="0 0 24 24"><path d="M3.500 6h17v2.200h-17zM3.500 10.900h17v2.200h-17zM3.500 15.800h17V18h-17z"/></svg></button>
    <button class="key first" data-key="VOLUME_MUTE" data-i18n-aria="key.mute"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4.500v-15L7 9zM21.500 9.300 20 7.800l-2.700 2.700-2.700-2.700-1.500 1.500 2.700 2.700-2.700 2.700 1.500 1.500 2.700-2.700 2.700 2.700 1.500-1.500-2.700-2.700z"/></svg></button>
    <button class="key right" id="open-text" data-i18n-aria="key.text" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M3.500 6h17A1.500 1.500 0 0 1 22 7.500v9a1.500 1.500 0 0 1-1.500 1.500h-17A1.500 1.500 0 0 1 2 16.500v-9A1.500 1.500 0 0 1 3.500 6zM5 9v2h2V9zm3.300 0v2h2V9zm3.400 0v2h2V9zm3.300 0v2h2V9zM5 13v2h2v-2zm3.500 0v2h7v-2zm8.500-4v2h2V9zm-1 4v2h3v-2z"/></svg></button>
  </div>

</main>

<div class="guide" id="guide" role="dialog" aria-modal="true" aria-labelledby="guide-title" hidden>
  <div class="sheet">
    <div>
      <div class="steps" id="guide-step"></div>
      <h1 id="guide-title" data-i18n="guide.title"></h1>
    </div>

    <section data-step="1">
      <p data-i18n="guide.one.intro"></p>
      <div>
        <h2 data-i18n="guide.fire.title"></h2>
        <ol>
          <li data-i18n="guide.fire.1"></li>
          <li data-i18n="guide.fire.2"></li>
          <li data-i18n="guide.fire.3"></li>
        </ol>
      </div>
      <div>
        <h2 data-i18n="guide.android.title"></h2>
        <ol>
          <li data-i18n="guide.android.1"></li>
          <li data-i18n="guide.android.2"></li>
          <li data-i18n="guide.android.3"></li>
        </ol>
      </div>
    </section>

    <section data-step="2" hidden>
      <p data-i18n="guide.two.intro"></p>
      <ol>
        <li data-i18n="guide.two.fire"></li>
        <li data-i18n="guide.two.android"></li>
      </ol>
      <form id="guide-connect"><input id="guide-address" placeholder="192.168.1.20" data-i18n-aria="field.address" autocomplete="off" spellcheck="false"><button data-i18n="action.connect"></button></form>
      <p class="error" id="guide-invalid" data-i18n="guide.invalid" hidden></p>
      <div class="row"><button class="pill" id="guide-find" type="button" data-i18n="action.find"></button></div>
      <ul class="found" id="guide-found" hidden></ul>
    </section>

    <section data-step="3" hidden>
      <p data-i18n="guide.three.intro"></p>
      <div class="outcome" role="status">
        <strong id="guide-outcome"></strong>
        <span id="guide-outcome-text"></span>
      </div>
    </section>

    <div class="actions">
      <button class="pill skip" id="guide-skip" type="button" data-i18n="action.skip"></button>
      <button class="pill" id="guide-back" type="button" data-i18n="action.back"></button>
      <button class="pill primary" id="guide-next" type="button" data-i18n="action.next"></button>
    </div>
  </div>
</div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
